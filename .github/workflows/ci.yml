name: ci
on:
  push:
    paths: ["erp/**", "supabase/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["erp/**", "supabase/**", ".github/workflows/ci.yml"]
jobs:
  erp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            erp/package-lock.json
            erp/worker/package-lock.json
      - run: npm ci
      - name: dependências do worker do WhatsApp (sem scripts de instalação)
        run: npm ci --prefix worker --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: tipos e pacote do worker
        run: |
          npm run typecheck --prefix worker
          npm run build --prefix worker
      - run: npm run build
        env:
          SUPABASE_URL: https://exemplo.supabase.co
          SUPABASE_ANON_KEY: chave-falsa-so-para-build
      - name: nenhum segredo no bundle do navegador
        run: |
          if grep -rq "SUPABASE_SERVICE_ROLE_KEY\|service_role" .next/static; then
            echo "segredo encontrado no bundle"; exit 1; fi
